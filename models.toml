# ============================================================================
# Google Gemini — ai.google.dev/gemini-api/docs/pricing (Paid tier, Standard)
# Two-tier prices (<=200k / >200k prompt) noted where they differ.
# "off knob" differs by generation: 3.x uses thinking_level:"minimal",
# 2.5 uses thinkingBudget:0. Pro/preview models are thinking_only (reject budget 0).
