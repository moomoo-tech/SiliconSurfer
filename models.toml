# SiliconSurfer — Model Registry
#
# Knowledge base of current LLMs the agentic runtime can select/route.
# Populated 2026-07-05 from FIRST-PARTY official pricing/model pages only
# (fetched via SiliconSurfer itself — see docs/USE_CASE_agent_uses_siliconsurfer.md).
# Prices are USD per 1M tokens. A `null`/omitted field is a real gap on the
# source page, NOT a guess — do not backfill from memory.
#
# Schema (per provider):
#   [provider.<name>]
#   default = "<model id used when caller doesn't pick>"
#   base_url_openai    = "..."   # OpenAI-compatible endpoint, if offered
#   base_url_anthropic = "..."   # Anthropic-compatible endpoint, if offered
#
#   [[provider.<name>.models]]
#   id            = "exact api model id string"
#   tier          = "flagship|balanced|small|coding|..."   # role hint for routing
#   price_in      = <float>      # cache-miss / standard input $/1M
#   price_cached  = <float|null> # cached-read input $/1M (null = not published)
#   price_out     = <float>      # output $/1M
#   context       = <int|null>   # max context tokens (null = not on pricing page)
#   thinking      = "none|optional|thinking_only"
#   off_knob      = "..."        # how to DISABLE thinking (only if optional/thinking_only)
#   modalities    = ["text","image","audio","video"]   # inputs
#   status        = "ga|preview|deprecated"
#   sunset        = "YYYY-MM-DD" # only if deprecated/scheduled removal
#   aliases       = ["..."]      # -latest / dateless pointers, if any

# ============================================================================
# Anthropic — docs.claude.com/en/docs/about-claude/models/overview + claude.com/pricing
# Usage accounting: fresh input billed separate from cache read/write.
# ============================================================================
[provider.anthropic]
default = "claude-opus-4-8"   # overview: "start with Opus 4.8 for complex agentic coding"
base_url_anthropic = "https://api.anthropic.com"

[[provider.anthropic.models]]
id = "claude-opus-4-8"
tier = "flagship"
price_in = 5.0
price_cached = 0.50   # cache read; write 6.25
price_out = 25.0
context = 1000000
thinking = "optional"   # adaptive; `effort` defaults high
off_knob = "thinking.type=disabled"
modalities = ["text", "image"]
status = "ga"
aliases = []            # dateless id is a pinned snapshot, not evergreen

[[provider.anthropic.models]]
id = "claude-fable-5"
tier = "flagship-max"
price_in = 10.0
price_cached = 1.00   # write 12.50
price_out = 50.0
context = 1000000
thinking = "thinking_only"   # adaptive thinking always on
modalities = ["text", "image"]
status = "ga"
aliases = []

[[provider.anthropic.models]]
id = "claude-sonnet-5"
tier = "balanced"
price_in = 2.0    # intro; -> 3.0 after 2026-08-31
price_cached = 0.20   # write 2.50
price_out = 10.0  # intro; -> 15.0 after 2026-08-31
context = 1000000
thinking = "optional"
off_knob = "thinking.type=disabled"
modalities = ["text", "image"]
status = "ga"
aliases = []

[[provider.anthropic.models]]
id = "claude-haiku-4-5-20251001"
tier = "small"
price_in = 1.0
price_cached = 0.10   # write 1.25
price_out = 5.0
context = 200000
thinking = "optional"   # extended thinking; not adaptive
off_knob = "thinking.type=disabled"
modalities = ["text", "image"]
status = "ga"
aliases = ["claude-haiku-4-5"]

